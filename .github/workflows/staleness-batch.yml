name: staleness-batch

# Re-tests one batch of recipes on latest stack versions, one isolated job per recipe. Called by staleness.yml
# once per batch, because a single matrix can't go over GitHub's 256-job cap.
on:
  workflow_call:
    inputs:
      recipes:
        description: "JSON array of recipe ids (at most 256)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        recipe: ${{ fromJson(inputs.recipes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g npm@11
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v6
      - run: npm ci || npm install
      - name: Re-test on latest stack versions (temp copy)
        run: node runner/staleness.mjs ${{ matrix.recipe }}
      - uses: actions/upload-artifact@v4
        with:
          name: stale-${{ matrix.recipe }}
          path: staleness/${{ matrix.recipe }}.json
