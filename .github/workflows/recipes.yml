name: recipes

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "Space-separated recipe ids to test (blank = all)"
        required: false
  schedule:
    - cron: "17 */6 * * *"   # release check every 6 hours
    - cron: "41 9 * * 1"     # full re-test every Monday
  push:
    branches: [main]
    paths: ["recipes/**", "runner/**"]

permissions:
  contents: write

concurrency: { group: recipes, cancel-in-progress: false }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.pick.outputs.total }}
      batch1: ${{ steps.pick.outputs.batch1 }}
      batch2: ${{ steps.pick.outputs.batch2 }}
      batch3: ${{ steps.pick.outputs.batch3 }}
      batch4: ${{ steps.pick.outputs.batch4 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g npm@11
      - run: npm ci || npm install
      - run: npm run validate
      - id: pick
        name: Pick recipes to test
        run: |
          if [ -n "${{ github.event.inputs.recipes }}" ]; then
            ids=$(printf '%s\n' ${{ github.event.inputs.recipes }} | jq -R . | jq -sc .)
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 */6 * * *" ]; then
            ids=$(node runner/affected.mjs --json)          # only recipes with a newer upstream release
          elif [ "${{ github.event_name }}" = "push" ]; then
            # fetch-depth 2 gives HEAD~1 so we only retest recipes touched in this commit.
            # Empty list means runner-only / docs-only: skip (do not fall back to all recipes).
            ids=$(git diff --name-only HEAD~1 HEAD -- recipes | cut -d/ -f2 | sort -u | jq -R . | jq -sc 'map(select(length>0))')
          else
            ids=$(ls recipes | jq -R . | jq -sc .)
          fi
          # A matrix can't go over 256 jobs, so split the list into up to 4 batches of 250.
          total=$(jq length <<<"$ids")
          if [ "$total" -gt 1000 ]; then
            echo "::error::$total recipes to test, over the 4 x 250 batch capacity. Add a batch job (test5) to this workflow."
            exit 1
          fi
          {
            echo "total=$total"
            for b in 1 2 3 4; do echo "batch$b=$(jq -c ".[$(( (b-1)*250 )):$(( b*250 ))]" <<<"$ids")"; done
          } >> "$GITHUB_OUTPUT"
          echo "Testing $total: $ids"

  # Batches run one after another, so at most 8 recipe jobs run at once (max-parallel in recipe-batch.yml).
  test1:
    needs: plan
    if: needs.plan.outputs.batch1 != '[]'
    uses: ./.github/workflows/recipe-batch.yml
    with: { recipes: "${{ needs.plan.outputs.batch1 }}" }

  test2:
    needs: [plan, test1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.batch2 != '[]' }}
    uses: ./.github/workflows/recipe-batch.yml
    with: { recipes: "${{ needs.plan.outputs.batch2 }}" }

  test3:
    needs: [plan, test2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.batch3 != '[]' }}
    uses: ./.github/workflows/recipe-batch.yml
    with: { recipes: "${{ needs.plan.outputs.batch3 }}" }

  test4:
    needs: [plan, test3]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.batch4 != '[]' }}
    uses: ./.github/workflows/recipe-batch.yml
    with: { recipes: "${{ needs.plan.outputs.batch4 }}" }

  publish:
    needs: [plan, test1, test2, test3, test4]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.total != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with: { pattern: receipt-*, path: new-receipts, merge-multiple: true }
      - run: npm ci || npm install
      - name: Commit receipts and index
        run: |
          git config user.name "provenpin-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! compgen -G "new-receipts/*.json" > /dev/null; then
            echo "::error::No receipts came back from the test jobs (planned ${{ needs.plan.outputs.total }}). Nothing to publish; check the test jobs above."
            exit 1
          fi
          # Another run may push receipts meanwhile. Each attempt starts from the latest main,
          # applies only this run's receipts, rebuilds the index and pushes; retry on rejection.
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp new-receipts/*.json receipts/
            node runner/build-index.mjs
            git add receipts index
            git diff --cached --quiet && exit 0
            git commit -q -m "receipts: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $i), retrying"; sleep $((i * 5))
          done
          exit 1
      - name: Deploy MCP server
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci || npm install && npx wrangler@4 deploy --var PROVENPIN_DEPLOY_COMMIT:$(git rev-parse HEAD)
