name: staleness

# Weekly check: re-test every recipe with its stack libraries bumped to the latest release.
# Pins are bumped in a temp copy only. Recipes and their last-passed receipts are never changed.
# Results go to index/staleness.json; recipes that break on latest are listed in one GitHub issue.
on:
  schedule:
    - cron: "23 13 * * 3"   # Wednesdays 13:23 UTC
  workflow_dispatch:
    inputs:
      recipes:
        description: "Space-separated recipe ids to check (blank = all)"
        required: false

permissions:
  contents: write
  issues: write

concurrency: { group: staleness, cancel-in-progress: false }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.pick.outputs.total }}
      batch1: ${{ steps.pick.outputs.batch1 }}
      batch2: ${{ steps.pick.outputs.batch2 }}
      batch3: ${{ steps.pick.outputs.batch3 }}
      batch4: ${{ steps.pick.outputs.batch4 }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.recipes }}" ]; then
            ids=$(printf '%s\n' ${{ github.event.inputs.recipes }} | jq -R . | jq -sc .)
          else
            ids=$(ls recipes | jq -R . | jq -sc .)
          fi
          # A matrix can't go over 256 jobs, so split the list into up to 4 batches of 250.
          total=$(jq length <<<"$ids")
          if [ "$total" -eq 0 ]; then
            echo "::error::No recipes to check."
            exit 1
          fi
          if [ "$total" -gt 1000 ]; then
            echo "::error::$total recipes to check, over the 4 x 250 batch capacity. Add a batch job (check5) to this workflow."
            exit 1
          fi
          {
            echo "total=$total"
            for b in 1 2 3 4; do echo "batch$b=$(jq -c ".[$(( (b-1)*250 )):$(( b*250 ))]" <<<"$ids")"; done
          } >> "$GITHUB_OUTPUT"
          echo "Checking $total: $ids"

  # Batches run one after another, so at most 8 check jobs run at once (max-parallel in staleness-batch.yml).
  check1:
    needs: plan
    if: needs.plan.outputs.batch1 != '[]'
    uses: ./.github/workflows/staleness-batch.yml
    with: { recipes: "${{ needs.plan.outputs.batch1 }}" }

  check2:
    needs: [plan, check1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.batch2 != '[]' }}
    uses: ./.github/workflows/staleness-batch.yml
    with: { recipes: "${{ needs.plan.outputs.batch2 }}" }

  check3:
    needs: [plan, check2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.batch3 != '[]' }}
    uses: ./.github/workflows/staleness-batch.yml
    with: { recipes: "${{ needs.plan.outputs.batch3 }}" }

  check4:
    needs: [plan, check3]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.batch4 != '[]' }}
    uses: ./.github/workflows/staleness-batch.yml
    with: { recipes: "${{ needs.plan.outputs.batch4 }}" }

  publish:
    needs: [plan, check1, check2, check3, check4]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.total != '0' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with: { pattern: stale-*, path: new-staleness, merge-multiple: true }
      - run: npm ci || npm install
      - name: Commit index/staleness.json
        run: |
          # No results means nothing was checked: don't re-stamp the old data with a new date.
          if ! compgen -G "new-staleness/*.json" > /dev/null; then
            echo "::error::No staleness results came back from the check jobs (planned ${{ needs.plan.outputs.total }}). Nothing to publish; check the jobs above."
            exit 1
          fi
          git config user.name "provenpin-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            node runner/staleness.mjs --merge new-staleness
            node runner/build-index.mjs
            git add index
            git diff --cached --quiet && exit 0
            git commit -q -m "staleness: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $i), retrying"; sleep $((i * 5))
          done
          exit 1
      - name: Open or update the broken-on-latest issue
        run: |
          title="Recipes that break on latest library versions"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number,title -q ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ ! -s staleness-broken.txt ]; then
            [ -n "$num" ] && gh issue comment "$num" --body "All checked recipes pass on latest versions as of $(date -u +%F). Closing." && gh issue close "$num"
            exit 0
          fi
          {
            echo "The weekly staleness check re-ran these recipes with their stack libraries bumped to the latest release. They failed."
            echo "The recipes themselves are unchanged and still pass on their pinned versions."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            node -e 'const s=require("./index/staleness.json");for(const id of require("fs").readFileSync("staleness-broken.txt","utf8").split("\n").filter(Boolean)){const r=s.recipes[id];console.log("- `"+id+"`: "+Object.entries(r.bumped||{}).map(([k,v])=>k+" "+v).join(", ")+(r.reason?" ("+r.reason+")":""))}'
          } > body.md
          if [ -n "$num" ]; then gh issue edit "$num" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi
