id: piccolo-sqlite-crud
title: "Piccolo ORM CRUD and migrations-style setup on sqlite"
summary: "Async Piccolo tables with a foreign key, a migrations-style schema built by create_db_tables, CRUD helpers, and offline tests on a sqlite file with AsyncTableTest and ModelBuilder."
language: python
runtime: python
runtime_version: "3.13"
stack: [piccolo]
tags: [orm, sqlite, database, migrations]
pinned:
  piccolo: "1.36.0"
  aiosqlite: "0.22.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - db.py
  - crud.py
  - tests/test_crud.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
