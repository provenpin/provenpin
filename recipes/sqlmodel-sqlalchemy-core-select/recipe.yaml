id: sqlmodel-sqlalchemy-core-select
title: "SQLModel tables queried with SQLAlchemy Core select on sqlite"
summary: "Query SQLModel-mapped tables with SQLAlchemy Core select and aggregate constructs, showing how result shapes differ from SQLModel's own select, tested offline on in-memory sqlite."
language: python
runtime: python
runtime_version: "3.13"
stack: [sqlmodel, sqlalchemy]
tags: [orm, sql, sqlite, testing]
pinned:
  sqlmodel: "0.0.48"
  sqlalchemy: "2.1.4"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - queries.py
  - tests/test_core_select.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
