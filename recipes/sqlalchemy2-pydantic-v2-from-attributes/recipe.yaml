id: sqlalchemy2-pydantic-v2-from-attributes
title: "SQLAlchemy 2 ORM rows serialized with Pydantic v2 from_attributes"
summary: "Map SQLAlchemy 2 models, expose nested relationships through Pydantic v2 schemas with from_attributes=True and a computed_field, and test them offline against in-memory SQLite."
language: python
runtime: python
runtime_version: "3.13"
stack: [sqlalchemy, pydantic]
tags: [orm, serialization, testing]
pinned:
  sqlalchemy: "2.1.4"
  pydantic: "2.14.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - schemas.py
  - tests/test_models.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
