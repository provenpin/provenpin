id: tabulate-markdown-report
title: "tabulate Markdown and grid reports from dict rows"
summary: "Turn lists of dicts into GitHub Markdown or grid tables with tabulate, controlling column order, labels, missing values and numeric alignment."
language: python
runtime: python
runtime_version: "3.13"
stack: [tabulate]
tags: [reporting, markdown, terminal-output]
pinned:
  tabulate: "0.10.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - report.py
  - tests/test_report.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
