id: litestar-guards-di
title: "Litestar app with DI, role guards and exception handlers"
summary: "A Litestar app with a dependency-injected repository, a role guard on DELETE, and a custom exception handler, tested offline with create_test_client and an in-memory fake."
language: python
runtime: python
runtime_version: "3.13"
stack: [litestar]
tags: [web-framework, dependency-injection, auth, testing]
pinned:
  litestar: "2.24.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app.py
  - tests/test_app.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
