id: structlog-stdlib-json-renderer
title: "structlog JSONRenderer routed through stdlib logging, captured in pytest"
summary: "Configure structlog to render one JSON line per event via stdlib logging and ProcessorFormatter, then cover the pytest side offline: caplog holds the event dict (not the JSON), format_exc_info keeps tracebacks JSON-safe, passing default= to JSONRenderer disables the __structlog__ hook, and reconfiguring never stacks handlers."
language: python
runtime: python
runtime_version: "3.13"
stack: [structlog]
tags: [logging, observability, testing]
pinned:
  structlog: "26.1.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - logging_setup.py
  - tests/test_logging.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
