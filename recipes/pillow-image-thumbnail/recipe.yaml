id: pillow-image-thumbnail
title: "Pillow thumbnail + EXIF orientation stripped"
summary: "Build aspect-correct JPEG thumbnails with Pillow, auto-rotating by EXIF orientation before resizing and stripping the stale orientation tag on save."
language: python
runtime: python
runtime_version: "3.13"
stack: [pillow]
tags: [images, thumbnails, exif]
pinned:
  pillow: "12.3.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - thumbnailer.py
  - tests/test_thumbnailer.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
