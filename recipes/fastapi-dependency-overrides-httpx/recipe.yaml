id: fastapi-dependency-overrides-httpx
title: "FastAPI dependency_overrides tested offline with httpx ASGITransport"
summary: "Override FastAPI dependencies (including nested ones) and drive the app in-process with httpx.ASGITransport, no network and no running server."
language: python
runtime: python
runtime_version: "3.13"
stack: [fastapi, httpx, pytest]
tags: [web, testing, async, dependency-injection]
pinned:
  fastapi: "0.143.2"
  httpx: "0.28.1"
  pytest: "9.1.1"
  pytest-asyncio: "1.4.0"
files:
  - requirements.txt
  - app.py
  - tests/test_app.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
