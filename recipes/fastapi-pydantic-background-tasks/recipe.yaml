id: fastapi-pydantic-background-tasks
title: "FastAPI background tasks + dependency overrides"
summary: "FastAPI BackgroundTasks for post-response work, with dependency_overrides to swap services in tests."
language: python
runtime: python
runtime_version: "3.13"
stack: [fastapi, pydantic]
tags: [api, background-jobs, testing]
pinned:
  fastapi: "0.143.1"
  httpx: "0.28.1"
  pydantic: "2.14.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app/__init__.py
  - app/main.py
  - tests/test_bg.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
