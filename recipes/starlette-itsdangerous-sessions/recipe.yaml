id: starlette-itsdangerous-sessions
title: "Starlette SessionMiddleware signed cookies with itsdangerous"
summary: "Add cookie sessions to a Starlette app via SessionMiddleware, then test login, tampering, logout, expiry and JSON safety fully offline over httpx ASGITransport."
language: python
runtime: python
runtime_version: "3.13"
stack: [starlette, itsdangerous, httpx]
tags: [web, sessions, cookies, testing]
pinned:
  starlette: "1.8.0"
  itsdangerous: "2.2.0"
  httpx: "0.28.1"
  pytest: "9.1.1"
  pytest-asyncio: "1.4.0"
files:
  - requirements.txt
  - app.py
  - tests/test_sessions.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
