id: fastapi-async-sqlalchemy-aiosqlite-pytest
title: "FastAPI with async SQLAlchemy 2 on aiosqlite, tested offline with per-test in-memory DBs"
summary: "A FastAPI app using AsyncSession and async_sessionmaker on aiosqlite, tested with httpx.AsyncClient over ASGITransport, overriding the session dependency with a fresh in-memory database for each test."
language: python
runtime: python
runtime_version: "3.13"
stack: [fastapi, sqlalchemy, aiosqlite, httpx, pytest-asyncio]
tags: [web-api, database, async, testing]
pinned:
  fastapi: "0.143.1"
  sqlalchemy: "2.1.4"
  aiosqlite: "0.22.1"
  httpx: "0.28.1"
  pytest-asyncio: "1.4.0"
  pytest: "9.1.1"
  greenlet: "3.2.4"
files:
  - requirements.txt
  - app.py
  - tests/test_app.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
