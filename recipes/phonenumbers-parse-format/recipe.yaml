id: phonenumbers-parse-format
title: "phonenumbers parse, format and validate E.164 numbers"
summary: "Normalize phone numbers to E.164 with Google's phonenumbers, tell possible apart from valid, and map numbers back to a region, all offline."
language: python
runtime: python
runtime_version: "3.13"
stack: [phonenumbers]
tags: [phone-numbers, validation, parsing]
pinned:
  phonenumbers: "9.0.41"
  pytest: "9.1.1"
files:
  - requirements.txt
  - phone.py
  - tests/test_phone.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
