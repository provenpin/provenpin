id: tenacity-retry-stop-wait
title: "tenacity Retrying with stop_after_attempt and wait_exponential"
summary: "Build a tenacity Retrying policy that stops after N attempts, backs off exponentially and only retries transient exception types, then prove the behavior offline under pytest."
language: python
runtime: python
runtime_version: "3.13"
stack: [tenacity]
tags: [retries, resilience, testing]
pinned:
  tenacity: "9.2.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - retrier.py
  - tests/test_retrier.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
