id: simpleeval-safe-expression
title: "simpleeval safe user formulas with custom names, functions and limits"
summary: "Evaluate untrusted user formulas with simpleeval using custom names and functions, per-type attribute allowlists, and the built-in power, shift and string size limits."
language: python
runtime: python
runtime_version: "3.13"
stack: [simpleeval]
tags: [expression-evaluation, sandboxing, security]
pinned:
  simpleeval: "1.0.8"
  pytest: "9.1.1"
files:
  - requirements.txt
  - formulas.py
  - tests/test_formulas.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
