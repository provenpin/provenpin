id: sqlite-utils-fts-search
title: "sqlite-utils inserts, upserts and full-text search on SQLite"
summary: "Build a notes table with sqlite-utils insert_all and upsert, wire up SQLite FTS5 search, and test the index sync gotchas offline in memory."
language: python
runtime: python
runtime_version: "3.13"
stack: [sqlite-utils]
tags: [sqlite, full-text-search, database, testing]
pinned:
  sqlite-utils: "4.2.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - notes.py
  - tests/test_notes.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
