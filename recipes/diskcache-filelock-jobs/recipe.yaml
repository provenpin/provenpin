id: diskcache-filelock-jobs
title: "Idempotent job cache with diskcache FanoutCache guarded by filelock"
summary: "Memoize expensive jobs in a sharded diskcache FanoutCache and run each one once across threads and processes with a filelock file lock, tested fully offline."
language: python
runtime: python
runtime_version: "3.13"
stack: [diskcache, filelock]
tags: [caching, idempotency, concurrency]
pinned:
  diskcache: "5.6.3"
  filelock: "4.2.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - jobs.py
  - tests/test_jobs.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
