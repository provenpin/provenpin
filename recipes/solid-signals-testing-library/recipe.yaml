  "@solidjs/testing-library": "0.8.10"
  "@testing-library/user-event": "14.6.8"
  "vite-plugin-solid": "2.11.14"
  "jsdom": "30.1.3"
  "vitest": "5.0.4"
  "@types/node": "26.6.5"
files:
  - package.json
  - src/Search.tsx
  - test/Search.test.tsx
  - tsconfig.json
  - vitest.config.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
test_report: test-report.json
