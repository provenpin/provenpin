id: nestjs-jwt-guard-testing
title: "NestJS JWT guard testing"
summary: "Issue and verify JWTs with @nestjs/jwt, protect a route with a Bearer-token AuthGuard, and assert 401 without a token and 200 with a valid one using supertest offline."
language: typescript
runtime: node
runtime_version: "22"
stack: ["@nestjs/core", "@nestjs/common", "@nestjs/jwt", "@nestjs/testing", "@nestjs/platform-express", "supertest"]
tags: [nestjs, jwt, auth, guard, testing]
pinned:
  "@nestjs/common": "12.1.3"
  "@nestjs/core": "12.1.3"
  "@nestjs/jwt": "12.0.3"
  "@nestjs/platform-express": "12.1.3"
  "@nestjs/testing": "12.1.3"
  "reflect-metadata": "0.2.2"
  "rxjs": "7.8.2"
  "supertest": "7.3.1"
  "@types/supertest": "7.2.1"
  "@types/node": "26.6.5"
  "tsx": "4.23.15"
files:
  - package.json
  - tsconfig.json
  - src/auth.service.ts
  - src/auth.guard.ts
  - src/auth.controller.ts
  - src/app.module.ts
  - test/auth.e2e.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
