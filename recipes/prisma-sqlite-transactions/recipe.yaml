  "tsx": "4.23.15"
  "@types/node": "24.19.2"
  "prisma": "7.10.0"
files:
  - package.json
  - prisma/schema.prisma
  - prisma.config.ts
  - src/bank.ts
  - test/bank.test.ts
setup: npm install --no-audit --no-fund && npx prisma db push && npx prisma generate
