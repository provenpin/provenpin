id: dateutil-rrule-zoneinfo-time-machine
title: "Recurring schedules with dateutil rrule and zoneinfo DST handling, frozen with time-machine"
summary: "Build daily wall-clock schedules in a named timezone with dateutil rrule and zoneinfo, then test DST gaps, overlaps and naive datetimes offline with time-machine."
language: python
runtime: python
runtime_version: "3.13"
stack: [python-dateutil, zoneinfo, time-machine]
tags: [scheduling, timezones, testing]
pinned:
  python-dateutil: "2.9.0.post0"
  six: "1.17.0"
  time-machine: "3.5.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - schedule.py
  - tests/test_schedule.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
