id: flask-jwt-extended-auth
title: "Flask 3 + Flask-JWT-Extended access and refresh tokens"
summary: "Login, protected routes, refresh tokens and custom claims in Flask 3 using Flask-JWT-Extended, with an app factory."
language: python
runtime: python
runtime_version: "3.13"
stack: [flask, flask-jwt-extended]
tags: [auth, jwt]
pinned:
  flask: "3.1.3"
  flask-jwt-extended: "4.7.4"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app.py
  - tests/test_auth.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
