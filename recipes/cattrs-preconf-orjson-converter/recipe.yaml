id: cattrs-preconf-orjson-converter
title: "cattrs preconfigured orjson converter for attrs datetimes"
summary: "An attrs model with timezone-aware datetime fields serialized through cattrs' preconfigured orjson converter, showing native RFC 3339 handling and the hooks you still need to add."
language: python
runtime: python
runtime_version: "3.13"
stack: [attrs, cattrs, orjson]
tags: [serialization, json, datetimes]
pinned:
  attrs: "26.1.0"
  cattrs: "26.2.1"
  orjson: "3.13.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - converter.py
  - tests/test_converter.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
