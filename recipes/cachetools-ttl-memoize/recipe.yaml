id: cachetools-ttl-memoize
title: "cachetools TTLCache + LRUCache memoization"
summary: "Memoize calls with cachetools TTLCache and LRUCache, control expiry with an injectable timer, and cache methods with cachedmethod."
language: python
runtime: python
runtime_version: "3.13"
stack: [cachetools]
tags: [caching, memoization, testing]
pinned:
  cachetools: "7.2.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - memoize.py
  - tests/test_memoize.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
