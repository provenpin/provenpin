id: pydantic-settings-nested-sources
title: "pydantic-settings nested BaseSettings with env_nested_delimiter"
summary: "Group configuration into nested Pydantic settings models and populate them from prefixed environment variables separated by a double underscore, tested fully offline."
language: python
runtime: python
runtime_version: "3.13"
stack: [pydantic-settings, pydantic]
tags: [configuration, settings, environment, testing]
pinned:
  pydantic-settings: "2.16.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - config.py
  - tests/test_config.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
