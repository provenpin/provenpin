id: nestjs-zod-validation-pipe
title: "NestJS Zod ValidationPipe for body DTOs"
summary: "Validate NestJS request bodies with a reusable Zod ValidationPipe that returns 400 field errors, tested through @nestjs/testing and supertest without relying on emitDecoratorMetadata."
language: typescript
runtime: node
runtime_version: "22"
stack: ["@nestjs/core", "@nestjs/common", zod]
tags: [nestjs, validation, zod, api]
pinned:
  "@nestjs/core": "12.1.3"
  "@nestjs/common": "12.1.3"
  "@nestjs/platform-express": "12.1.3"
  "zod": "4.6.7"
  "reflect-metadata": "0.2.2"
  "rxjs": "7.8.2"
  "@types/node": "26.6.5"
  "tsx": "4.23.15"
  "@nestjs/testing": "12.1.3"
  "supertest": "7.3.1"
  "@types/supertest": "7.2.1"
  "@types/express": "5.0.6"
files:
  - package.json
  - tsconfig.json
  - src/zod-pipe.ts
  - src/app.ts
  - test/app.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
