  "vitest": "5.0.5"
  "msw": "3.0.3"
files:
  - package.json
  - tsconfig.json
  - src/api.ts
  - test/api.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
test_report: test-report.json
