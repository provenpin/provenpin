id: pytest-hypothesis-pydantic-roundtrip
title: "Hypothesis property tests for Pydantic v2 models"
summary: "Property-based tests with Hypothesis on Pydantic v2 models: JSON round trips, validator invariants, and a stateful RuleBasedStateMachine for a small inventory class."
language: python
runtime: python
runtime_version: "3.13"
stack: [hypothesis, pydantic]
tags: [testing, property-based-testing, validation]
pinned:
  hypothesis: "6.169.4"
  pydantic: "2.14.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - inventory.py
  - tests/test_models.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
