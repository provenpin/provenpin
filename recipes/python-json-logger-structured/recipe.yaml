id: python-json-logger-structured
title: "Structured JSON logs with python-json-logger, captured in tests"
summary: "Emit one JSON object per log record with python-json-logger 4.x, using extra fields, renamed keys, static fields, timestamp and exception info, and assert the parsed output offline."
language: python
runtime: python
runtime_version: "3.13"
stack: [python-json-logger]
tags: [logging, observability, testing]
pinned:
  python-json-logger: "4.2.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - logging_setup.py
  - tests/test_logging.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
