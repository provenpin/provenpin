id: aiohttp-pytest-plugin-client
title: "aiohttp routes tested offline with the pytest-aiohttp test client"
summary: "An aiohttp JSON app exercised through the pytest-aiohttp in-process test client, plus a conftest that brings loopback up so the client runs inside a network-isolated sandbox."
language: python
runtime: python
runtime_version: "3.13"
stack: [aiohttp, pytest-aiohttp, pytest-asyncio]
tags: [http-server, testing, async]
pinned:
  aiohttp: "3.14.5"
  pytest-aiohttp: "1.1.1"
  pytest: "9.1.1"
  pytest-asyncio: "1.4.0"
files:
  - requirements.txt
  - app.py
  - conftest.py
  - tests/test_app.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
