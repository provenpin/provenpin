id: oslo-sessions-totp-2fa
title: "Hashed session tokens and TOTP 2FA with node:crypto and @oslojs/encoding"
summary: "Lucia-guide style sessions with random tokens stored only as sha256 hashes, sliding expiry and per-user revocation, plus TOTP enrolment URIs, grace-window verification and single-use recovery codes using node:crypto (HMAC-SHA1 HOTP/TOTP per RFC 4226/6238) and @oslojs/encoding, tested against the RFC 6238 test vectors with node:test mock timers. Replaces @oslojs/crypto and @oslojs/otp, which npm marks as no longer supported (no reason given)."
language: typescript
runtime: node
runtime_version: "22"
stack: ["@oslojs/encoding"]
tags: [auth, sessions, 2fa, totp, hotp, node-crypto, security]
pinned:
  "@oslojs/encoding": "1.1.0"
  "tsx": "4.23.15"
  "@types/node": "26.6.5"
files:
  - package.json
  - src/auth.ts
  - test/auth.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
