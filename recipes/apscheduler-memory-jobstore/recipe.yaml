id: apscheduler-memory-jobstore
title: "APScheduler BackgroundScheduler with an in-memory jobstore"
summary: "Register interval and one-off jobs on a BackgroundScheduler backed by MemoryJobStore, then test scheduling, replacement and execution offline without a persistent store."
language: python
runtime: python
runtime_version: "3.13"
stack: [apscheduler]
tags: [scheduling, background-jobs, testing]
pinned:
  apscheduler: "3.11.3"
  pytest: "9.1.1"
files:
  - requirements.txt
  - scheduler.py
  - tests/test_scheduler.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
