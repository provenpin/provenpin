id: requests-cache-sqlite-backend
title: "requests-cache CachedSession with sqlite backend and expiry"
summary: "A requests session backed by a persistent sqlite cache with TTL expiry and 200-only caching, tested offline with responses mocks."
language: python
runtime: python
runtime_version: "3.13"
stack: [requests, requests-cache, responses]
tags: [http-client, caching, testing]
pinned:
  requests: "2.34.2"
  requests-cache: "1.3.3"
  responses: "0.26.3"
  pytest: "9.1.1"
files:
  - requirements.txt
  - cache_session.py
  - tests/test_cache.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
