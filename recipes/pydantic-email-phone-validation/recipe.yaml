id: pydantic-email-phone-validation
title: "Pydantic v2 email and phone validation with email-validator and phonenumbers"
summary: "Validate emails with EmailStr and normalize phone numbers to E164 with phonenumbers inside a Pydantic model, tested offline with no network lookups."
language: python
runtime: python
runtime_version: "3.13"
stack: [pydantic, email-validator, phonenumbers]
tags: [validation, contact-info, testing]
pinned:
  pydantic: "2.14.1"
  email-validator: "2.3.0"
  phonenumbers: "9.0.41"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - tests/test_models.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
