id: python-dateutil-relativedelta-billing
title: "dateutil relativedelta month-end billing cycle math"
summary: "Compute calendar billing cycles from an anchor date with dateutil relativedelta, keeping month-end anchors on the real last day, and lock the behavior down offline with pytest."
language: python
runtime: python
runtime_version: "3.13"
stack: [python-dateutil]
tags: [dates, billing, testing]
pinned:
  python-dateutil: "2.9.0.post0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - billing.py
  - tests/test_billing.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
