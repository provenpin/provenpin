id: xlsxwriter-charts-bytesio
title: "XlsxWriter workbook with a chart written to BytesIO under pytest"
summary: "Build an in-memory .xlsx with XlsxWriter, insert a column chart that references cell ranges, and verify the archive structure offline with zipfile."
language: python
runtime: python
runtime_version: "3.13"
stack: [xlsxwriter, pytest]
tags: [excel, charts, bytesio, testing]
pinned:
  xlsxwriter: "3.2.9"
  pytest: "9.1.1"
files:
  - requirements.txt
  - report.py
  - tests/test_report.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
