id: aiofiles-anyio-temp-io
title: "aiofiles async file IO coordinated by anyio under pytest-asyncio"
summary: "Write and read files with aiofiles, fan out concurrent reads with an anyio task group, serialize appends with anyio.Lock, and test it all offline with pytest-asyncio."
language: python
runtime: python
runtime_version: "3.13"
stack: [aiofiles, anyio, pytest-asyncio]
tags: [file-io, async, testing]
pinned:
  aiofiles: "25.1.0"
  anyio: "4.15.1"
  pytest-asyncio: "1.4.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - io_utils.py
  - tests/test_io_utils.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
