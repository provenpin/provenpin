id: pydantic-settings-dotenv-secrets
title: "pydantic-settings nested dotenv config with SecretStr masking"
summary: "Compose nested pydantic-settings models from .env files, mask credentials with SecretStr, and pin down env precedence and JSON parsing offline."
language: python
runtime: python
runtime_version: "3.13"
stack: [pydantic-settings, python-dotenv]
tags: [configuration, secrets, dotenv, testing]
pinned:
  pydantic-settings: "2.16.0"
  python-dotenv: "1.2.4"
  pytest: "9.1.1"
files:
  - requirements.txt
  - settings.py
  - env.example
  - tests/test_settings.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
