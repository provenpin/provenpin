id: polib-po-catalog-roundtrip
title: "polib PO catalog read, edit and write roundtrip with MO compile"
summary: "Read, edit and write gettext PO catalogs with polib, compile them to MO, and audit fuzzy and untranslated entries fully offline."
language: python
runtime: python
runtime_version: "3.13"
stack: [polib]
tags: [i18n, gettext, localization]
pinned:
  polib: "1.2.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - catalog.py
  - tests/test_catalog.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
