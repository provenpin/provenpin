id: attrs-cattrs-structuring
title: "attrs models with cattrs structuring, custom datetime hooks and renaming"
summary: "Define attrs classes with validators and converters, then use a cattrs Converter with custom datetime hooks and wire-name renaming, roundtrip through unstructure/structure, and inspect ClassValidationError details. Tested offline."
language: python
runtime: python
runtime_version: "3.13"
stack: [attrs, cattrs]
tags: [serialization, validation, typing]
pinned:
  attrs: "26.1.0"
  cattrs: "26.2.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - converter.py
  - tests/test_converter.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
