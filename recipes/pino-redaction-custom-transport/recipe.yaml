id: pino-redaction-custom-transport
title: "pino logging with redaction, request context and a custom transport"
summary: "A pino 10 logger with path and wildcard redaction, error serialisers, string levels and an AsyncLocalStorage mixin for request ids, plus a pino-abstract-transport alert sink combined via multistream, tested offline against in-memory streams."
