id: pyparsing-arith-expression-grammar
title: "pyparsing arithmetic grammar with infix_notation"
summary: "Parse and evaluate arithmetic expressions with pyparsing infix_notation, wiring operator precedence and associativity to parse actions, with variable lookup."
language: python
runtime: python
runtime_version: "3.13"
stack: [pyparsing]
tags: [parsing, expressions, dsl]
pinned:
  pyparsing: "3.3.3"
  pytest: "9.1.1"
files:
  - requirements.txt
  - grammar.py
  - tests/test_grammar.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
