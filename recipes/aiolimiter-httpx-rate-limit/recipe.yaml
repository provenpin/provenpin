id: aiolimiter-httpx-rate-limit
title: "aiolimiter AsyncLimiter guarding httpx AsyncClient offline"
summary: "Throttle an httpx AsyncClient with aiolimiter's leaky-bucket AsyncLimiter and test the burst, serialized concurrency, error and event-loop reuse gotchas fully offline with httpx.MockTransport."
language: python
runtime: python
runtime_version: "3.13"
stack: [aiolimiter, httpx]
tags: [http-client, rate-limiting, async, testing]
pinned:
  aiolimiter: "1.3.0"
  httpx: "0.28.1"
  pytest-asyncio: "1.4.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - client.py
  - tests/test_client.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
