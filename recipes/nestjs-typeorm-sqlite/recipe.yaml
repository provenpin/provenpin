id: nestjs-typeorm-sqlite
title: "NestJS 12 + TypeORM 1 on in-memory SQLite, tested with @nestjs/testing"
summary: "A NestJS module with a TypeORM entity, repository-backed service and controller, wired to in-memory SQLite and tested end to end through the Nest app with supertest. better-sqlite3 stays on 12.x because TypeORM 1.1 peers on ^12."
language: typescript
runtime: node
runtime_version: "22"
stack: ["@nestjs/core", "@nestjs/typeorm", typeorm, better-sqlite3]
tags: [nestjs, orm, api, sqlite]
pinned:
  "@nestjs/core": "12.1.3"
  "@nestjs/common": "12.1.3"
  "@nestjs/platform-express": "12.1.3"
  "@nestjs/typeorm": "12.0.2"
  "typeorm": "1.1.2"
  "better-sqlite3": "12.11.1"
  "reflect-metadata": "0.2.2"
  "rxjs": "7.8.2"
  "tsx": "4.23.15"
  "@types/node": "24.19.2"
  "@nestjs/testing": "12.1.3"
  "supertest": "7.3.1"
  "@types/supertest": "7.2.1"
  "@types/express": "5.0.6"
files:
  - package.json
  - tsconfig.json
  - src/app.ts
  - test/app.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
