id: cryptography-passlib-bcrypt
title: "passlib bcrypt hashing with a cryptography HMAC pepper"
summary: "Hash and verify passwords with passlib's CryptContext bcrypt scheme, prefixing each password with a cryptography HMAC-SHA256 pepper so bcrypt's 72 byte limit cannot silently truncate, and cover identify, unknown hashes and work factor rehash detection offline."
language: python
runtime: python
runtime_version: "3.13"
stack: [passlib, bcrypt, cryptography]
tags: [auth, security, passwords]
pinned:
  passlib: "1.7.4"
  bcrypt: "4.0.1"
  cryptography: "50.0.2"
  pytest: "9.1.1"
files:
  - requirements.txt
  - passwords.py
  - tests/test_passwords.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
