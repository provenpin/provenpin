id: sqlalchemy-factory-boy-sqlite
title: "factory_boy SQLAlchemy ModelFactory on in-memory sqlite"
summary: "Declare SQLAlchemy 2.0 models and factory_boy ModelFactory fixtures bound to a shared in-memory sqlite session, tested fully offline with pytest."
language: python
runtime: python
runtime_version: "3.13"
stack: [sqlalchemy, factory-boy]
tags: [orm, testing, fixtures]
pinned:
  sqlalchemy: "2.1.4"
  factory-boy: "3.3.3"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - factories.py
  - tests/test_factories.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
