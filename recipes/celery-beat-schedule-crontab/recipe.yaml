id: celery-beat-schedule-crontab
title: "Celery beat crontab schedules validated and run eagerly"
summary: "Define beat_schedule crontab entries, validate task names and schedule types before deploy, and test each scheduled call offline with task_always_eager."
language: python
runtime: python
runtime_version: "3.13"
stack: [celery]
tags: [queues, scheduling, testing]
pinned:
  celery: "5.6.3"
  pytest: "9.1.1"
files:
  - requirements.txt
  - tasks.py
  - tests/test_schedule.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
