id: faker-polyfactory-seeded
title: "Faker and polyfactory seeded Pydantic model factories offline"
summary: "Define Pydantic models and generate fixtures offline with polyfactory, binding one Faker instance so Use() providers and seed_random stay reproducible."
language: python
runtime: python
runtime_version: "3.13"
stack: [faker, polyfactory, pydantic]
tags: [testing, fixtures, data-generation]
pinned:
  faker: "40.43.0"
  polyfactory: "3.3.0"
  pydantic: "2.14.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - factories.py
  - tests/test_factories.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
