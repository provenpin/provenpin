id: pandas-sqlalchemy-to-sql
title: "pandas to_sql and read_sql with a SQLAlchemy 2 engine on sqlite, with dtype handling"
summary: "Write and read DataFrames through a SQLAlchemy 2 engine, control column types with dtype, and handle datetimes and nullable ints, tested offline on in-memory sqlite."
language: python
runtime: python
runtime_version: "3.13"
stack: [pandas, sqlalchemy]
tags: [data, sql, database]
pinned:
  pandas: "3.0.6"
  sqlalchemy: "2.1.4"
  pytest: "9.1.1"
  numpy: "2.3.4"
  python-dateutil: "2.9.0.post0"
  six: "1.17.0"
  typing-extensions: "4.15.0"
  iniconfig: "2.1.0"
  pluggy: "1.6.0"
  pygments: "2.19.2"
files:
  - requirements.txt
  - db.py
  - tests/test_db.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
