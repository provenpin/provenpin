id: sqlmodel-relationships-sqlite
title: "SQLModel one-to-many and many-to-many relationships tested on in-memory SQLite"
summary: "Model one-to-many and link-table many-to-many relationships with SQLModel, load them with selectinload, and test offline on in-memory SQLite with StaticPool."
language: python
runtime: python
runtime_version: "3.13"
stack: [sqlmodel, sqlalchemy]
tags: [orm, database, testing]
pinned:
  sqlmodel: "0.0.48"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - tests/test_models.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
