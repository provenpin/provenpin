id: flask-wtforms-csrf-validation
title: "Flask-WTF forms with custom validators, CSRF on and off in tests"
summary: "A Flask-WTF form with a reusable custom WTForms validator, rendered errors, and CSRF protection, tested offline with the Flask test client: CSRF disabled in the test config, then enforced."
language: python
runtime: python
runtime_version: "3.13"
stack: [flask, flask-wtf, wtforms]
tags: [web, forms, csrf, testing]
pinned:
  flask: "3.1.3"
  flask-wtf: "1.3.0"
  wtforms: "3.2.2"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app.py
  - tests/test_forms.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
