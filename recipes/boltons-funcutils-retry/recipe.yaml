id: boltons-funcutils-retry
title: "Boltons retry decorator and cached property helpers under pytest"
summary: "A signature-preserving retry decorator composed with boltons.funcutils.wraps, plus cacheutils cachedproperty and cachedmethod memoization tested offline with pytest."
language: python
runtime: python
runtime_version: "3.13"
stack: [boltons]
tags: [retry, caching, decorators]
pinned:
  boltons: "26.2.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - helpers.py
  - tests/test_helpers.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
