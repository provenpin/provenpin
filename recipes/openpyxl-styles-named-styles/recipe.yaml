id: openpyxl-styles-named-styles
title: "openpyxl NamedStyle fonts, fills and freeze panes"
summary: "Build an xlsx report with reusable NamedStyles for a header font and fill plus a currency number format, pin the header row with freeze panes, and verify it all survives a save and load round trip."
language: python
runtime: python
runtime_version: "3.13"
stack: [openpyxl]
tags: [excel, spreadsheets, reporting]
pinned:
  openpyxl: "3.1.5"
  pytest: "9.1.1"
files:
  - requirements.txt
  - report.py
  - tests/test_report.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
