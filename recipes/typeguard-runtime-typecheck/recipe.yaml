id: typeguard-runtime-typecheck
title: "Runtime type checking with typeguard: @typechecked, check_type and generics"
summary: "Enforce annotations at runtime with typeguard: @typechecked functions, standalone check_type, TypeCheckError messages and bounded TypeVars, plus the FIRST_ITEM container gotcha."
language: python
runtime: python
runtime_version: "3.13"
stack: [typeguard]
tags: [type-checking, validation, testing]
pinned:
  typeguard: "4.6.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - checks.py
  - tests/test_checks.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
