id: watchdog-events-tmpdir
title: "watchdog Observer filesystem events in tmp_path"
summary: "Watch a directory with watchdog Observer and assert on created, modified, moved and deleted events delivered on a background thread, using pytest tmp_path."
language: python
runtime: python
runtime_version: "3.13"
stack: [watchdog]
tags: [filesystem, events, testing]
pinned:
  watchdog: "6.0.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - watcher.py
  - tests/test_watcher.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
