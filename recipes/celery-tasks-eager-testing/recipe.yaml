id: celery-tasks-eager-testing
title: "Celery 5 tasks, chains and groups tested in eager mode"
summary: "Define Celery tasks, chain and fan them out with groups, then test them offline with task_always_eager and the in-memory broker."
language: python
runtime: python
runtime_version: "3.13"
stack: [celery]
tags: [queues, background-jobs, workers]
pinned:
  celery: "5.6.3"
  pytest: "9.1.1"
files:
  - requirements.txt
  - tasks.py
  - tests/test_tasks.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
