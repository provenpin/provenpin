pinned:
  "@aws-sdk/client-dynamodb": "3.1152.0"
  "@aws-sdk/lib-dynamodb": "3.1152.0"
  "@aws-sdk/client-sqs": "3.1152.0"
  "aws-sdk-client-mock": "4.1.0"
  "aws-sdk-client-mock-vitest": "8.0.0"
  "vitest": "5.0.5"
  "@types/node": "26.6.5"
files:
  - package.json
  - src/orders.ts
  - test/orders.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
