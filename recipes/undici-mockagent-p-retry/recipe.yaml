id: undici-mockagent-p-retry
title: "undici HTTP client with p-retry backoff, tested with MockAgent"
summary: "A JSON client on undici.request wrapped in p-retry that retries 429, 5xx and network errors but aborts on other 4xx, tested offline with undici MockAgent, disableNetConnect and assertNoPendingInterceptors."
