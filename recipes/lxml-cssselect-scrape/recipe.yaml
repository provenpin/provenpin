id: lxml-cssselect-scrape
title: "lxml + cssselect HTML fixture scraping into typed records"
summary: "Parse an HTML fixture with lxml.html and cssselect into frozen dataclasses with Decimal prices, handling direct-text vs text_content, missing attributes and pseudo-element errors."
language: python
runtime: python
runtime_version: "3.13"
stack: [lxml, cssselect]
tags: [html, parsing, scraping, testing]
pinned:
  lxml: "6.1.3"
  cssselect: "1.6.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - scrape.py
  - tests/test_scrape.py
  - tests/fixtures/products.html
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
