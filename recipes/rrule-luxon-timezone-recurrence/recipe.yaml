id: rrule-luxon-timezone-recurrence
title: "rrule recurring events across timezones and DST with luxon"
summary: "Generate weekly and monthly recurrences with rrule in floating wall-clock time and map them into real IANA zones with luxon, so 9am stays 9am across DST, plus toText, RFC 5545 round trip and BYSETPOS."
language: typescript
runtime: node
runtime_version: "22"
stack: [rrule, luxon]
tags: [recurrence, calendar, timezone, dst]
pinned:
