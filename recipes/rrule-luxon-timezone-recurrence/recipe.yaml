  "luxon": "3.7.2"
  "@types/node": "26.6.5"
  "tsx": "4.23.15"
files:
  - package.json
  - src/schedule.ts
  - test/schedule.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
