id: networkx-shortest-path-dag
title: "NetworkX DiGraph shortest paths, topological sort and cycle detection"
summary: "Build a directed dependency graph, topologically order it, detect cycles with find_cycle, and pick shortest routes while keeping weighted Dijkstra vs hop-count BFS straight."
language: python
runtime: python
runtime_version: "3.13"
stack: [networkx]
tags: [graph, algorithms, pathfinding]
pinned:
  networkx: "3.6.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - graph.py
  - tests/test_graph.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
