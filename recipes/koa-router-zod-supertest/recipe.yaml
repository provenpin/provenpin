id: koa-router-zod-supertest
title: "Koa 3 REST API with @koa/router, Zod validation and supertest"
summary: "A Koa 3 JSON API using @koa/router and @koa/bodyparser with Zod 4 body and param validation mapped to 400 responses by a central error middleware, tested offline with supertest."
language: typescript
runtime: node
runtime_version: "22"
stack: [koa, "@koa/router", "@koa/bodyparser", zod, supertest]
tags: [api, validation, rest, testing]
pinned:
  "koa": "3.2.1"
  "@koa/router": "15.7.0"
  "@koa/bodyparser": "6.1.0"
  "zod": "4.6.7"
  "supertest": "7.3.1"
  "tsx": "4.23.15"
  "@types/node": "26.6.5"
files:
  - package.json
  - src/app.ts
  - test/app.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
