language: python
runtime: python
runtime_version: "3.13"
stack: [msgspec]
tags: [serialization, validation, schemas]
pinned:
  msgspec: "0.22.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - tests/test_models.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
