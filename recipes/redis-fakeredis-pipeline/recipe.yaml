id: redis-fakeredis-pipeline
title: "redis-py pipelines and WATCH transactions tested with fakeredis"
summary: "Batch commands with redis-py pipelines and guard optimistic WATCH/MULTI transactions, tested fully offline against a shared in-memory fakeredis server."
language: python
runtime: python
runtime_version: "3.13"
stack: [redis, fakeredis]
tags: [cache, transactions, testing]
pinned:
  redis: "8.1.0"
  fakeredis: "2.40.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - pipeline.py
  - tests/test_pipeline.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
