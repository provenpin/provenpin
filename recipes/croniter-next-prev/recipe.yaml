id: croniter-next-prev
title: "croniter get_next and get_prev for cron schedule iteration"
summary: "Walk cron expressions forward and backward with croniter, returning datetimes or epoch seconds, and handle the day_or OR versus AND gotcha."
language: python
runtime: python
runtime_version: "3.13"
stack: [croniter]
tags: [scheduling, cron, datetime]
pinned:
  croniter: "6.2.4"
  pytest: "9.1.1"
files:
  - requirements.txt
  - schedule.py
  - tests/test_schedule.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
