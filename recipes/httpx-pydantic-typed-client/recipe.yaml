id: httpx-pydantic-typed-client
title: "Typed httpx client parsing into pydantic v2 models, tested with respx"
summary: "An async httpx client that retries 5xx and transport errors, validates responses into pydantic v2 models, and is tested offline with respx route mocks."
language: python
runtime: python
runtime_version: "3.13"
stack: [httpx, pydantic, respx]
tags: [http-client, validation, testing]
pinned:
  httpx: "0.28.1"
  pydantic: "2.14.1"
  respx: "0.23.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - client.py
  - tests/test_client.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
