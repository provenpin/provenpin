id: flask-login-sqlalchemy-sessions
title: "Flask-Login sessions with Flask-SQLAlchemy users and werkzeug password hashing"
summary: "Login, login_required redirects, logout and a user_loader built on db.session.get, with the User model in SQLite memory and tests run through the Flask test client."
language: python
runtime: python
runtime_version: "3.13"
stack: [flask, flask-login, flask-sqlalchemy, werkzeug]
tags: [web, auth, sessions, testing]
pinned:
  flask: "3.1.3"
  flask-login: "0.6.3"
  flask-sqlalchemy: "3.1.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app.py
  - tests/test_app.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
