id: peewee-playhouse-sqlite-json
title: "peewee JSONField queries on SQLite after SqliteExtDatabase removal"
summary: "Store and query JSON documents with peewee's core JSONField on SqliteDatabase, covering item access, as_text, has_key, contains and in-place mutations, plus the peewee 4 removal of playhouse SqliteExtDatabase."
language: python
runtime: python
runtime_version: "3.13"
stack: [peewee]
tags: [orm, sqlite, json, testing]
pinned:
  peewee: "4.5.3"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - tests/test_json.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
