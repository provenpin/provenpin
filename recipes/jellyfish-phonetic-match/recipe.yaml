id: jellyfish-phonetic-match
title: "jellyfish soundex, metaphone and Jaro-Winkler for name matching"
summary: "Build a case and accent insensitive name matcher from jellyfish phonetic keys and Jaro-Winkler similarity, handling soundex collisions, spelling variants and empty keys."
language: python
runtime: python
runtime_version: "3.13"
stack: [jellyfish]
tags: [fuzzy-matching, string-similarity, phonetic]
pinned:
  jellyfish: "1.3.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - matcher.py
  - tests/test_matcher.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
