id: flask-migrate-sqlite
title: "Flask-SQLAlchemy models with Flask-Migrate upgrades on sqlite in tests"
summary: "Define Flask-SQLAlchemy models, version the schema with Flask-Migrate, and test upgrade, downgrade and model/migration drift offline on a temporary sqlite file."
language: python
runtime: python
runtime_version: "3.13"
stack: [flask, flask-sqlalchemy, flask-migrate, sqlalchemy, alembic]
tags: [database, migrations, testing]
pinned:
  flask: "3.1.3"
  flask-sqlalchemy: "3.1.1"
  flask-migrate: "4.1.0"
  pytest: "9.1.1"
  alembic: "1.16.5"
  mako: "1.3.10"
  sqlalchemy: "2.0.43"
  typing-extensions: "4.15.0"
  werkzeug: "3.1.3"
  jinja2: "3.1.6"
  markupsafe: "3.0.3"
  itsdangerous: "2.2.0"
  blinker: "1.9.0"
  click: "8.3.0"
  iniconfig: "2.1.0"
  pluggy: "1.6.0"
  pygments: "2.19.2"
files:
  - requirements.txt
  - models.py
  - app.py
  - migrations/env.py
  - migrations/versions/3f2a1b7c9d10_create_user.py
  - tests/test_migrations.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
