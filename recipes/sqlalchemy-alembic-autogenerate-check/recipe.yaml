id: sqlalchemy-alembic-autogenerate-check
title: "Alembic autogenerate compare_metadata drift check against SQLite"
summary: "Declare SQLAlchemy 2 models with a naming convention, then detect schema drift offline by diffing the live SQLite schema against the metadata with Alembic compare_metadata."
language: python
runtime: python
runtime_version: "3.13"
stack: [sqlalchemy, alembic, sqlite]
tags: [databases, migrations, testing]
pinned:
  sqlalchemy: "2.1.4"
  alembic: "1.20.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - tests/test_drift.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
