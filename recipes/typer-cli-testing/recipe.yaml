id: typer-cli-testing
title: "Typer CLI with subcommands, options and CliRunner tests"
summary: "Build a Typer CLI with subcommands, typed options, env var fallbacks and exit codes, tested with typer.testing.CliRunner."
language: python
runtime: python
runtime_version: "3.13"
stack: [typer]
tags: [cli, testing]
pinned:
  typer: "0.27.3"
  pytest: "9.1.1"
files:
  - requirements.txt
  - cli.py
  - tests/test_cli.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
