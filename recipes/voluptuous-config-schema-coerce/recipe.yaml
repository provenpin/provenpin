id: voluptuous-config-schema-coerce
title: "voluptuous config schemas with Coerce, All, Range and Required"
summary: "Validate and coerce stringly-typed config into a typed dict with voluptuous, combining Coerce, All, Range, In and Required, and testing the failure paths offline."
language: python
runtime: python
runtime_version: "3.13"
stack: [voluptuous]
tags: [config, validation, schema]
pinned:
  voluptuous: "0.16.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - config.py
  - tests/test_config.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
