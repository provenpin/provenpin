id: jsonwebtoken-hs256-rs256
title: "jsonwebtoken HS256 and RS256"
summary: "Sign and verify JSON Web Tokens with jsonwebtoken: HS256 secrets plus RS256 RSA keys from node:crypto, with deterministic expiry via clockTimestamp, issuer and audience checks, and rejection of the none algorithm."
language: typescript
runtime: node
runtime_version: "22"
stack: [jsonwebtoken]
tags: [jwt, auth, crypto, security]
pinned:
