  "@types/jsonwebtoken": "9.0.10"
  "@types/node": "26.6.5"
  "tsx": "4.23.15"
files:
  - package.json
  - src/tokens.ts
  - test/tokens.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
