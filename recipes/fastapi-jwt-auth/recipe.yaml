id: fastapi-jwt-auth
title: "FastAPI + PyJWT bearer auth"
summary: "OAuth2 password flow in FastAPI issuing PyJWT tokens, with a current-user dependency guarding routes."
language: python
runtime: python
runtime_version: "3.13"
stack: [fastapi, pyjwt]
tags: [auth, jwt]
pinned:
  fastapi: "0.143.1"
  pyjwt: "2.15.1"
  httpx: "0.28.1"
  python-multipart: "0.0.32"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app/__init__.py
  - app/main.py
  - tests/test_auth.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
