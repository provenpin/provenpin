id: injector-di-modules
title: "injector Modules, @provider, singleton scope and ClassAssistedBuilder"
summary: "Wire a small app with injector Modules, a @provider method, singleton-scoped services and ClassAssistedBuilder assisted construction, then override bindings with a test module."
language: python
runtime: python
runtime_version: "3.13"
stack: [injector, pytest]
tags: [dependency-injection, testing, architecture]
pinned:
  injector: "0.24.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app.py
  - tests/test_app.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
