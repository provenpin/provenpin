id: structlog-bound-logger-context
title: "structlog bound logger contextvars + stdlib ProcessorFormatter"
summary: "One JSON ProcessorFormatter renders both structlog events and foreign stdlib records while per-request contextvars bound with bind_contextvars are merged in, tested offline by capturing the log stream."
language: python
runtime: python
runtime_version: "3.13"
stack: [structlog]
tags: [logging, observability, contextvars, testing]
pinned:
  structlog: "26.1.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - observability.py
  - tests/test_observability.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q