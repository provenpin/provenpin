id: reportlab-platypus-table
title: "reportlab Platypus SimpleDocTemplate with Table and Paragraph styles"
summary: "Render a PDF report from a Platypus story: SimpleDocTemplate, custom ParagraphStyle headings, and a styled Table with zebra rows and a repeating header."
language: python
runtime: python
runtime_version: "3.13"
stack: [reportlab]
tags: [pdf, documents, tables, reporting]
pinned:
  reportlab: "5.0.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - report.py
  - tests/test_report.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
