id: rich-typer-progress-cli
title: "Typer CLI with rich Progress and Table for batch jobs"
summary: "A Typer command that squares a batch of numbers behind a rich Progress bar and prints a rich Table summary, tested offline through typer's CliRunner."
language: python
runtime: python
runtime_version: "3.13"
stack: [typer, rich]
tags: [cli, progress, testing]
pinned:
  typer: "0.27.3"
  rich: "15.0.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app.py
  - tests/test_app.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
