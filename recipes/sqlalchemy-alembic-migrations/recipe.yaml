id: sqlalchemy-alembic-migrations
title: "SQLAlchemy 2 + Alembic programmatic migrations"
summary: "Alembic migrations driven from Python (upgrade, downgrade, autogenerate check) against SQLite, with SQLAlchemy 2 models."
language: python
runtime: python
runtime_version: "3.13"
stack: [sqlalchemy, alembic, sqlite]
tags: [migrations, database]
pinned:
  sqlalchemy: "2.1.4"
  alembic: "1.20.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - migrations/env.py
  - migrations/script.py.mako
  - migrations/versions/0001_create_account.py
  - tests/test_migrations.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
