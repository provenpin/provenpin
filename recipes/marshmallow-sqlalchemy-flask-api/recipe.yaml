id: marshmallow-sqlalchemy-flask-api
title: "Flask API with Flask-SQLAlchemy and marshmallow-sqlalchemy, validation errors as 422"
summary: "A Flask JSON API that loads and dumps SQLAlchemy models through SQLAlchemyAutoSchema, returns validation errors as 422, and is tested offline with the Flask test client on in-memory sqlite."
language: python
runtime: python
runtime_version: "3.13"
stack: [flask, flask-sqlalchemy, marshmallow-sqlalchemy, marshmallow, sqlalchemy]
tags: [web-api, validation, database]
pinned:
  flask: "3.1.3"
  flask-sqlalchemy: "3.1.1"
  marshmallow-sqlalchemy: "1.5.0"
  marshmallow: "3.26.1"
  sqlalchemy: "2.0.36"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app.py
  - tests/test_app.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
