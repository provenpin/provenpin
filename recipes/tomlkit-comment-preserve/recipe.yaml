id: tomlkit-comment-preserve
title: "Edit and dump TOML with tomlkit while preserving comments and order"
summary: "Load TOML with tomlkit, mutate scalar values, arrays and sections in place, then dump it back with comments, spacing and key order intact."
language: python
runtime: python
runtime_version: "3.13"
stack: [tomlkit]
tags: [config, serialization, files]
pinned:
  tomlkit: "0.15.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - config.py
  - tests/test_config.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
