id: litestar-dto-sqlalchemy
title: "Litestar app with advanced-alchemy and DTOs on SQLite"
summary: "A Litestar app wired to SQLAlchemy through the advanced-alchemy plugin, with separate read and write DTOs over aiosqlite, tested offline with litestar.testing TestClient."
language: python
runtime: python
runtime_version: "3.13"
stack: [litestar, advanced-alchemy, aiosqlite]
tags: [web-framework, orm, testing]
pinned:
  litestar: "2.24.0"
  advanced-alchemy: "1.11.0"
  aiosqlite: "0.22.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - app.py
  - tests/test_app.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
