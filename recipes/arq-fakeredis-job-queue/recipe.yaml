id: arq-fakeredis-job-queue
title: "arq background jobs tested offline against fakeredis"
summary: "Define arq async jobs with retries and follow-up task enqueueing, run them through a burst Worker, and exercise the queue offline on fakeredis."
language: python
runtime: python
runtime_version: "3.13"
stack: [arq, fakeredis]
tags: [queues, background-jobs, async, testing]
pinned:
  arq: "0.28.0"
  fakeredis: "2.40.0"
  pytest-asyncio: "1.4.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - jobs.py
  - tests/test_jobs.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
