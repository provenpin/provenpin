id: sqlalchemy-async-aiosqlite
title: "SQLAlchemy 2 async ORM + aiosqlite with pytest-asyncio"
summary: "SQLAlchemy 2.x typed async ORM (Mapped, mapped_column, async_sessionmaker, selectinload) on aiosqlite, with pytest-asyncio fixtures."
language: python
runtime: python
runtime_version: "3.13"
stack: [sqlalchemy, aiosqlite, pytest-asyncio]
tags: [orm, database, async, sqlite]
pinned:
  sqlalchemy: "2.1.4"
  aiosqlite: "0.22.1"
  greenlet: "3.5.6"
  pytest-asyncio: "1.4.0"
  pytest: "9.1.1"
files:
  - requirements.txt
  - models.py
  - tests/test_models.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
