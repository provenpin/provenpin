id: ioredis-cache-aside-mock
title: "ioredis cache-aside with TTL, tested with ioredis-mock (Vitest)"
summary: "Cache-aside helper on ioredis with JSON values, TTLs, stampede-safe single flight and invalidation, tested offline with ioredis-mock in Vitest. Install uses --legacy-peer-deps because ioredis-mock 8 still peers on ioredis ^5, but the mock passes its tests against ioredis 6. vite is pinned so Vitest still resolves under legacy-peer-deps."
language: typescript
runtime: node
runtime_version: "22"
stack: [ioredis, ioredis-mock, vitest]
tags: [cache, redis, mocking]
pinned:
  "ioredis": "6.0.0"
  "@types/node": "24.19.2"
  "vitest": "5.0.5"
  "vite": "8.3.4"
  "ioredis-mock": "8.13.1"
  "@types/ioredis-mock": "8.2.8"
files:
  - package.json
  - tsconfig.json
  - src/cache.ts
  - test/cache.test.ts
setup: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts=false
test: npm test
test_report: test-report.json
