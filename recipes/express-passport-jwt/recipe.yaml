language: typescript
runtime: node
runtime_version: "22"
stack: [express, passport, passport-jwt, jsonwebtoken]
tags: [auth, jwt, passport]
pinned:
  "express": "5.3.0"
  "passport": "0.7.0"
  "passport-jwt": "4.0.1"
  "jsonwebtoken": "9.0.3"
  "tsx": "4.23.15"
  "@types/node": "24.19.2"
  "supertest": "7.3.1"
  "@types/supertest": "7.2.1"
  "@types/express": "5.0.6"
  "@types/passport": "1.0.17"
  "@types/passport-jwt": "4.0.1"
  "@types/jsonwebtoken": "9.0.10"
files:
  - package.json
  - src/app.ts
  - test/app.test.ts
setup: npm install --no-audit --no-fund --ignore-scripts=false
test: npm test
