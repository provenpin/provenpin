id: hypothesis-stateful-rulebasedstatemachine
title: "Hypothesis RuleBasedStateMachine against a model"
summary: "Drive a bounded map through Hypothesis rules, bundles, invariants and preconditions, checking every step against a plain-dict reference model."
language: python
runtime: python
runtime_version: "3.13"
stack: [hypothesis]
tags: [property-based-testing, stateful-testing, testing]
pinned:
  hypothesis: "6.170.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - store.py
  - tests/test_stateful.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
