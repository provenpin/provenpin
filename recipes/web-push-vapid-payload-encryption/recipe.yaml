id: web-push-vapid-payload-encryption
title: "web-push VAPID keys and aes128gcm payload encryption, verified offline"
summary: "Generate VAPID keys and the exact push-service request with web-push (no send), then decrypt the aes128gcm payload as the browser would with http_ece and verify the ES256 VAPID JWT with node:crypto."
