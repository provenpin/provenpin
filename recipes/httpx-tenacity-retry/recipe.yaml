id: httpx-tenacity-retry
title: "httpx client + tenacity retries with backoff, tested with respx"
summary: "Retry transient HTTP failures (5xx, 429, timeouts) with tenacity around an httpx client, honoring a max attempt count, tested offline with respx."
language: python
runtime: python
runtime_version: "3.13"
stack: [httpx, tenacity, respx]
tags: [http-client, retries, mocking]
pinned:
  httpx: "0.28.1"
  tenacity: "9.2.1"
  respx: "0.23.1"
  pytest: "9.1.1"
files:
  - requirements.txt
  - client.py
  - tests/test_client.py
  - pytest.ini
setup: uv venv -q .venv && uv pip install -q --python .venv/bin/python -r requirements.txt
test: .venv/bin/python -m pytest -q
