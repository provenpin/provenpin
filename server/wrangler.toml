name = "provenpin-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Pro API keys (groundwork, off by default). Free tier needs no key and is unchanged.
# To turn on later: set PROVENPIN_PRO_ENABLED = "true", then either
#   npx wrangler secret put PROVENPIN_API_KEYS        (comma-separated keys), or
#   use the PRO_KEYS KV namespace below with entries "key:<sha256 hex of the key>" (value: any label).
[vars]
PROVENPIN_PRO_ENABLED = "false"
PROVENPIN_REQUIRE_KEY = "false"

# KV namespace for Pro keys. Create it with: npx wrangler kv namespace create PRO_KEYS
# (needs a token with Workers KV Storage Edit), then paste the id here and uncomment.
# [[kv_namespaces]]
# binding = "PRO_KEYS"
# id = "<namespace id>"

# Privacy-safe usage counts (see src/usage.ts). No IPs, user agents or query text are recorded.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "provenpin_usage"

[observability]
enabled = true
head_sampling_rate = 1
