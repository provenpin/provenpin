name = "provenpin-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Pro API keys (groundwork, off by default). Free tier needs no key and is unchanged.
# To turn on later: set PROVENPIN_PRO_ENABLED = "true", then either
#   npx wrangler secret put PROVENPIN_API_KEYS        (comma-separated keys), or
#   use the PRO_KEYS KV namespace below with entries "key:<sha256 hex of the key>" (value: any label).
[vars]
PROVENPIN_PRO_ENABLED = "false"
PROVENPIN_REQUIRE_KEY = "false"
# Anonymous real-usage counter (see USAGE-COUNTER.md). Off by default.
PROVENPIN_USAGE_COUNTER = "true"
# PROVENPIN_DEPLOY_COMMIT is not set here: pass it at deploy time so /health reports the live commit:
#   npx wrangler deploy --var PROVENPIN_DEPLOY_COMMIT:$(git rev-parse HEAD)

# KV namespace for Pro keys. Create it with: npx wrangler kv namespace create PRO_KEYS
# (needs a token with Workers KV Storage Edit), then paste the id here and uncomment.
# [[kv_namespaces]]
# binding = "PRO_KEYS"
# id = "<namespace id>"

# Rate limits (optional; absent = no limit). Cloudflare Workers Rate Limiting binding, no extra cost.
# Free: 60 req/min per IP. Pro: 600 req/min per key id. Uncomment to enable (needs a deploy).
# [[ratelimits]]
# name = "FREE_RL"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }
# [[ratelimits]]
# name = "PRO_RL"
# namespace_id = "1002"
# simple = { limit = 600, period = 60 }

# Privacy-safe usage counts (see src/usage.ts). No IPs, user agents or query text are recorded.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "provenpin_usage"

# Anonymous real-usage counter (see USAGE-COUNTER.md). Uncomment to enable, with PROVENPIN_USAGE_COUNTER = "true".
[[analytics_engine_datasets]]
binding = "USAGE_COUNTER"
dataset = "provenpin_real_usage"
# Optional, for "sessions with 2+ real calls": npx wrangler kv namespace create USAGE_SESSIONS
# and npx wrangler secret put USAGE_COUNTER_SALT (any random string).
[[kv_namespaces]]
binding = "USAGE_SESSIONS"
id = "8a333c2d5edd432d9bf6bd60365c7acc"

[observability]
enabled = true
head_sampling_rate = 1
